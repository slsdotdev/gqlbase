# ------------------------------------------------------------------------------
# Ledger: custom and 64-bit scalars
# ------------------------------------------------------------------------------

"""
A money movement. Amounts are in minor units (cents) as `SafeInt`: up to 2^53 - 1, instead of
the int4 cap of `Int` (21,474,836.47 in major units).
"""
type LedgerEntry @model {
  id: UUID!
  amountMinor: SafeInt!
  currency: Currency!
  """
  The day the entry is booked on. Month reports filter it with `between`.
  """
  bookedOn: Date!
  memo: String
}
